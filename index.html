<style>
/* 레이아웃: 위 = 영업·디자인·공장 3줄 공정(칸마다 지금 건수, 건이 있으면 숨쉬는 점), 아래 = 건별 카드. 사무실 모니터에 띄워 두는 용도 */
:root{
  --bg:#f5f6f7; --surface:#fff; --ink:#1b2128; --muted:#5d6974; --line:#dce1e6; --chip:#eef2f5;
  --accent:#0a7fa3; --warn:#b5531a; --done:#2f7d4f; --live:#21a366;
  --sales:#1f6fb8; --design:#7a4fb3; --factory:#b06a12; --admin:#2f7d4f;
  --sales-bg:#e8f1fa; --design-bg:#f2ecf9; --factory-bg:#fbf1e3; --admin-bg:#e8f4ec;
  --sans:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --mono:"IBM Plex Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#12161a; --surface:#1b2026; --ink:#e7ebef; --muted:#9aa6b2; --line:#2e353d; --chip:#232a31;
  --accent:#4cc1e3; --warn:#ef9a62; --done:#6fcf97; --live:#4fd18b;
  --sales:#78b4ee; --design:#b79be6; --factory:#e8a959; --admin:#74cf98;
  --sales-bg:#17283a; --design-bg:#261d36; --factory-bg:#33260f; --admin-bg:#16301f; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;padding:0 20px;padding-block:18px 40px}
.wrap{max-width:1400px;margin:0 auto;display:grid;gap:18px}
header{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between}
h1{font-size:1.4rem;margin:0}
h2{font-size:1rem;margin:0}
.livebox{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--live);flex:none}
.dot.stale{background:var(--warn)}
.clock{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.kpis{display:flex;flex-wrap:wrap;gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:.82rem;color:var(--muted)}
.kpi b{font-family:var(--mono);font-size:1.15rem;color:var(--ink);margin-right:4px;font-variant-numeric:tabular-nums}
.kpi.late b{color:var(--warn)}
.kpi.alarm{background:var(--late-bg);border-color:var(--late)}.kpi.alarm b{color:var(--late)}
.kpi.stale{background:var(--stale-bg);border-color:var(--stale)}
:root{--late:#e5484d;--late-bg:#fdecec;--stale:#d99a00;--stale-bg:#fff6d9;--ok:#2f9e5f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--late-bg:#3a1d1f;--stale-bg:#3a3014}}
:root[data-theme="dark"]{--late-bg:#3a1d1f;--stale-bg:#3a3014}
.wk{display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline;font-size:.82rem;color:var(--muted);padding:6px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.wk b{color:var(--ink);font-family:var(--mono);font-size:1.05rem}.wk span{white-space:nowrap}
.legend{font-size:.78rem;color:var(--muted);margin:2px 0 -4px}.legend i{font-style:normal;margin-right:10px}
.legend i{white-space:nowrap}.legend .r{color:var(--late)}.legend .y{color:var(--stale)}.legend .g{color:var(--ok)}
.step .jl span.c-late{box-shadow:inset 4px 0 0 var(--late);padding-left:8px}
.step .jl span.c-stale{box-shadow:inset 4px 0 0 var(--stale);padding-left:8px}
.step .jl span.c-ok{box-shadow:inset 4px 0 0 var(--ok);padding-left:8px}

.lanes{display:grid;gap:8px}
.lane{display:grid;grid-template-columns:92px minmax(0,1fr);gap:8px}
.lane-name{border-radius:8px;padding:8px 10px;font-weight:700;display:grid;align-content:center}
.lane-name small{font-weight:400;font-size:.72rem;opacity:.85}
.lane[data-l="sales"] .lane-name{background:var(--sales-bg);color:var(--sales)}
.lane[data-l="design"] .lane-name{background:var(--design-bg);color:var(--design)}
.lane[data-l="factory"] .lane-name{background:var(--factory-bg);color:var(--factory)}
.lane[data-l="admin"] .lane-name{background:var(--admin-bg);color:var(--admin)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.step{position:relative;flex:1 1 130px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;display:grid;grid-template-columns:auto 1fr;gap:0 9px;align-items:center;cursor:pointer;font:inherit;color:inherit;text-align:left}
.step[aria-pressed="true"]{border-color:var(--accent);background:var(--chip)}
.step:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.step .n{font-family:var(--mono);font-size:1.3rem;grid-row:span 2;font-variant-numeric:tabular-nums}
.step .n.zero{color:var(--muted);opacity:.5}
.step .l{font-size:.82rem;line-height:1.25;word-break:keep-all}
.step .t{font-size:.68rem;color:var(--muted)}
.step .pulse{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%}
.lane[data-l="sales"] .pulse{background:var(--sales)}.lane[data-l="design"] .pulse{background:var(--design)}
.lane[data-l="factory"] .pulse{background:var(--factory)}.lane[data-l="admin"] .pulse{background:var(--admin)}
.arrow{align-self:center;color:var(--muted);font-size:.8rem}
.step .cl{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:3px;margin-top:4px;min-width:0}
.step .jl{grid-column:1/-1;display:grid;gap:1px;margin-top:3px;min-width:0}
.step .jl span{font-size:.74rem;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:3px;padding:0 3px}
.step .jl span:hover{background:var(--chip)}.step .jl span b{font-family:var(--mono);font-weight:500;color:var(--accent);margin-right:4px}
.step .jl .more{color:var(--muted)}.step.has .t{display:none}
.step .cl span{font-size:.7rem;line-height:1.5;background:var(--chip);color:var(--ink);border-radius:4px;padding:0 5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step[aria-pressed="true"] .cl span{background:var(--surface)}
.tag{font-size:.64rem;padding:0 4px;border-radius:4px;border:1px solid var(--warn);color:var(--warn);margin-left:4px;white-space:nowrap}

.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar select,.bar button{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:5px 10px;cursor:pointer}
.list{display:grid;gap:4px;grid-template-columns:1fr}
/* 한 줄 목록(무옥님 10/5 "제작요청 칸이 너무 커, 한눈에"): 줄을 누르면 그 건만 자세히 펼침 */
.line{display:grid;grid-template-columns:62px minmax(0,1fr) 150px 220px 230px auto;gap:8px;align-items:center;cursor:pointer;font-size:.92rem;min-height:30px}
.line .no{font-size:.82rem}.line .it{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line .sp{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.84rem}.line .cl{font-weight:700;font-size:.95rem;white-space:normal;word-break:keep-all}
.line .now{font-size:.8rem;padding:1px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.line .now.ing{border-radius:999px;padding:2px 8px;font-weight:700}.now.ing.g{background:#e3f4e5;color:#1b5e20}.now.ing.y{background:#fff3cd;color:#8a5a00}.now.ing.b{background:#e3eef8;color:#1d4f73}.now.ing.q{background:#fde2e2;color:#b42318}
.line .b{padding:3px 9px;font-size:.82rem;white-space:nowrap}
.card.compact{padding:2px 10px;gap:6px}.card.open{border-color:var(--accent)}
.card .body{display:grid;gap:7px;border-top:1px dashed var(--line);padding-top:7px}
.items{width:100%;border-collapse:collapse;font-size:.84rem}.items th{color:var(--muted);font-weight:500;text-align:left}
.items th,.items td{padding:2px 6px;border-bottom:1px solid var(--line)}.items td.n{text-align:right;font-family:var(--mono);white-space:nowrap}
.items tfoot td{font-weight:700;border-bottom:0}
@media (max-width:700px){ /* 폰: 윗줄 번호·거래처(안 자름)·자세히, 다음 줄 품목, 그다음 부수 (무옥님 10/5 21:45 "거래처 한눈에, 글씨 크게") */
  .line{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"no cl bt" "it it it" "sp sp sp" "ng ng ng";row-gap:2px;padding:4px 0}
  .line .no{grid-area:no}.line .it{grid-area:it}.line .b{grid-area:bt}.line .cl{grid-area:cl;white-space:normal;overflow:visible;font-size:18px;font-weight:700;color:var(--ink)}.line .it{font-size:20px;white-space:normal}.line .sp{grid-area:sp;white-space:normal}.line .now{display:none}.line .now.ing{display:inline-block;grid-area:ng;justify-self:start;font-size:14px;white-space:normal;margin-top:4px}
  .items{font-size:.8rem}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:7px;min-width:0}
.card.changed{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.top{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.no{font-family:var(--mono);font-size:.8rem;color:var(--accent)}
.item{font-weight:700;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:.83rem;display:flex;flex-wrap:wrap;gap:2px 12px}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:15px;color:var(--muted);line-height:1.5}
.chain i{font-style:normal;opacity:.6}.jl .ws{font-style:normal;color:var(--factory);font-weight:700}.chain .done{color:var(--muted)}
.chain .cur{font-weight:800;padding:1px 8px;border-radius:6px}
.chain .cur.sales{background:var(--sales-bg);color:var(--sales)}.chain .cur.design{background:var(--design-bg);color:var(--design)}.chain .cur.factory{background:var(--factory-bg);color:var(--factory)}.chain .cur.fin{background:var(--admin-bg);color:var(--done)}
.prog{display:flex;gap:3px}
.prog span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.prog span.sales{background:var(--sales)}.prog span.design{background:var(--design)}.prog span.factory{background:var(--factory)}.prog span.admin{background:var(--admin)}
.prog span.cur{animation:blink 1.6s ease-in-out infinite}
.now{justify-self:start;font-size:.85rem;font-weight:500;border-radius:6px;padding:2px 8px}
.now.sales{background:var(--sales-bg);color:var(--sales)}.now.design{background:var(--design-bg);color:var(--design)}
.now.factory{background:var(--factory-bg);color:var(--factory)}.now.admin{background:var(--admin-bg);color:var(--admin)}.now.fin{background:var(--admin-bg);color:var(--done)}.now.bad{background:var(--chip);color:var(--warn)}
.note{font-size:.83rem;color:var(--warn);overflow-wrap:anywhere}
.who{font-size:.74rem;color:var(--muted)}
.did{font-size:.88rem;border-left:3px solid var(--line);padding:3px 0 3px 9px;display:grid;gap:2px;overflow-wrap:anywhere}
.did .h{font-weight:700}.did .h small{font-weight:400;color:var(--muted);margin-left:6px}
.did .r{color:var(--ink)}.did .r em{font-style:normal;color:var(--muted);margin-right:6px}
.did.none{color:var(--muted);font-size:.82rem}
details.hist{font-size:.84rem}details.hist summary{cursor:pointer;color:var(--muted)}
details.hist ol{margin:6px 0 0;padding-left:18px;display:grid;gap:3px}
details.hist li small{color:var(--muted)}
.late{color:var(--warn);font-weight:500}
.dt{display:inline-block;margin-left:8px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}.dt.old{color:var(--warn)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:24px;color:var(--muted);text-align:center;grid-column:1/-1}
@media (max-width:560px){.lane{grid-template-columns:1fr}.arrow{display:none}body{padding:0 16px;padding-block:16px 32px}}
@media (prefers-reduced-motion:no-preference){
  .dot:not(.stale),.step .pulse{animation:breathe 2s ease-in-out infinite}
  .card,.step{transition:border-color .3s,box-shadow .6s}
  .flash{animation:flash 1.2s ease-out}
}
@media (prefers-reduced-motion:reduce){.prog span.cur{animation:none}}
@keyframes breathe{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes flash{0%{background:var(--chip)}100%{background:var(--surface)}}
</style>
<style>
.btns{display:flex;flex-wrap:wrap;gap:6px}
button.b{font:inherit;font-size:.85rem;border-radius:7px;padding:6px 12px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button.b.p{background:var(--accent);color:#fff;border-color:var(--accent)}
button.b:disabled{opacity:.45;cursor:default}
button.b:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.crow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.form{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.form[hidden]{display:none}
.form label,.edit label{display:grid;gap:3px;font-size:.78rem;color:var(--muted);min-width:0}
.form input,.form select,.edit input,.edit select,.me select,.me input{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:5px 8px;min-width:0}
.form .act{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}
details.more{font-size:.85rem}
details.more summary{cursor:pointer;color:var(--muted)}
.edit{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-top:8px}
.me{display:flex;gap:6px;align-items:center;font-size:.85rem;color:var(--muted)}
.detail{border-top:1px dashed var(--line);margin-top:.6rem;padding-top:.6rem;display:flex;flex-direction:column;gap:.3rem}
.detail h4{margin:.5rem 0 .1rem;font-size:1rem}
.detail .dl{display:flex;gap:.8rem;font-size:.95rem}.detail .dl span{min-width:5.5em;color:var(--muted,#888)}.detail .dl b{font-weight:600;word-break:break-all}
.detail .dlog{margin:0;padding-left:1.2rem;display:flex;flex-direction:column;gap:.4rem;font-size:.92rem}
.detail .deliv{display:flex;flex-direction:column;gap:.5rem}.detail .deliv label{display:flex;flex-direction:column;gap:.25rem;font-size:.92rem}.detail .deliv input{font:inherit;padding:.5rem;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.detail .btns,.detail .confirm{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}.detail .confirm span{font-weight:700;width:100%}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:.88rem;max-width:calc(100% - 32px)}
.toast[hidden]{display:none}
.mock{background:var(--factory-bg);color:var(--factory);border-radius:8px;padding:6px 12px;font-size:.82rem}
/* 오늘 저녁 일량: 디티피아 주문(20시 확정) + CIP 판 도착(21~22시) */
.daily{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--factory);border-radius:10px;padding:10px 14px;display:grid;gap:8px}
.daily[hidden]{display:none}
.daily .dh{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.daily .dh small{color:var(--muted);font-size:.78rem}.daily .dh small.warn{color:var(--warn)}
.daily .nums{display:flex;flex-wrap:wrap;gap:8px}
.daily .nums span{background:var(--factory-bg);border-radius:8px;padding:4px 10px;font-size:.82rem;color:var(--muted)}
.daily .nums b{font-family:var(--mono);font-size:1.1rem;color:var(--ink);margin-right:3px;font-variant-numeric:tabular-nums}
.daily #dtList>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.daily #dtList>summary::-webkit-details-marker{display:none}
.daily #dtList>summary .go{font-size:16px;color:var(--factory);font-weight:600}
.dtt{width:100%;border-collapse:collapse;font-size:16px;margin-top:8px}
.dtt th{background:var(--factory-bg);color:var(--muted);font-weight:600;text-align:left;padding:6px 8px;border-bottom:2px solid var(--line);white-space:nowrap}
.dtt td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.dtt td.n{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.dtt .pan{font-weight:700;white-space:nowrap}
.dtt .ok{color:var(--good,#2e7d32);white-space:nowrap}.dtt .no{color:var(--warn);font-weight:700;white-space:nowrap;font-size:16px}.dtt .ok{font-size:16px}
.dtt .m1{display:none}
@media(max-width:760px){.dtt thead{display:none}.dtt,.dtt tbody{display:block}.dtt tr{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.dtt td{border:0;padding:0;font-size:16px}.dtt td.h{display:none}.dtt td.m1{display:block;grid-column:1/-1;font-size:17px;margin-bottom:4px}
.dtt td[data-l]::before{content:attr(data-l)" ";color:var(--muted);font-size:14px}.dtt td.memo{grid-column:1/-1}}
.daily .nums .bad b{color:var(--warn)}
.daily .ln{font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}
.daily .ln b{color:var(--ink);font-weight:500}
.daily .ln.warn b{color:var(--warn)}
.daily .ln.call b{color:var(--done)}
/* 사무실 PC 살아있음 신호 */
/* ── 한 화면 배치 (무옥님 10/5 "스크롤 없이 한눈에, 누르면 열리게") ──
   넓은 화면: 글자 크기가 화면 높이·너비에 맞춰 바뀌고, 공정 4줄이 남은 높이를 채움. 건별 목록은 오른쪽 서랍으로 열림(쪽 넘김 버튼). */
html{font-size:clamp(12px,calc(.42vw + .78vh),19px)}
body{font-size:1rem}
.kpi{font:inherit;font-size:.82rem;cursor:pointer;text-align:left}
.kpi:hover,.kpi[aria-pressed="true"]{border-color:var(--accent)}
.kpi:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.topact{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.daily{padding:.5rem .9rem;gap:.35rem}
.daily .dh h2{font-size:.95rem}
.daily .nums{align-items:center}
.daily .nums span{padding:.15rem .6rem}
.daily .nums b{font-size:1rem}
.daily details summary{cursor:pointer;font-size:.8rem;color:var(--accent);list-style:none}
.daily details summary::-webkit-details-marker{display:none}
.daily details summary::marker{content:""}
.daily details[open] summary{margin-bottom:.25rem}
.daily .verdict{font-size:.82rem;border-radius:8px;padding:.15rem .6rem;background:var(--chip);color:var(--ink)}
.daily .verdict.call{color:var(--done)}.daily .verdict.warn{color:var(--warn)}
.drawer{position:fixed;inset:0 0 0 auto;width:min(1000px,94vw);background:var(--bg);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:.6rem;padding:.9rem 1rem;z-index:20}
.drawer[hidden]{display:none}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:19}
.shade[hidden]{display:none}

<body>
<div class="gate" id="gate" hidden>
  <form class="gbox" id="gateForm" autocomplete="off">
    <h1>삼보아트 작업 흐름표</h1>

</div>
<div class="wrap">
  <header>
    <div><h1>삼보아트 작업 흐름표</h1></div>
    <div class="livebox"><span class="dot stale" id="dot"></span><span id="liveTxt">불러오는 중…</span><span class="clock" id="clock"></span></div>
  </header>

    <div id="wk"></div>

  </div>


  <section class="daily" id="daily" hidden aria-label="오늘 저녁 일량"></section>

  <p class="legend">건마다 왼쪽 색 줄: <i class="r">● 납품일 지남</i><i class="y">● 7일째 그대로</i><i class="g">● 순조</i></p>

    <div class="dhead"><button type="button" class="back" id="dBack">← 뒤로</button><h2 id="dTitle">건별 현황</h2><button type="button" class="b" id="dClose">닫기 ✕</button></div>

      <select id="fSales" aria-label="영업 담당"><option value="">영업 담당 전체</option><option>강명성</option><option>김지열</option><option>박인규</option><option>담당 확인</option></select>
      <select id="fClient" aria-label="거래처"><option value="">거래처 전체</option></select>
      <select id="fDone" aria-label="진행 상태"><option value="open">진행 중만</option><option value="arch">📦 보관함 (서류 확인 전)</option></select>

    </div>
    <form class="form" id="addForm" hidden>
      <label>책·품목 이름<input id="nItem" required placeholder="예: 해커스 토익 750 LC"></label>

      <label>영업 담당<select id="nSales"><option>강명성</option><option>김지열</option><option>박인규</option><option selected>담당 확인</option></select></label>

    <p class="who">단계를 바꾸면 이 화면을 연 모든 사람한테 몇 초 안에 똑같이 바뀌어. 저장은 구글 시트 '삼보 작업현황'에 돼.</p>
  </section>

<div class="toast" id="toast" role="status" hidden></div>
<script>
const LANES=[{k:"sales",name:"영업",sub:"강명성·김지열·박인규"},{k:"design",name:"디자인",sub:"디자인팀"},{k:"factory",name:"공장",sub:"생산·외주"}];
const STEPS=[
  ["sales","견적 요청 받음","거래처 메일"],["sales","견적 보냄","견적서·회신"],["sales","제작 요청·접수","접수대장 번호"],
  ["design","디자인 요청","콘셉트·납품일 상의"],["design","편집 작업","인디자인"],["design","거래처 컨펌","시안·수정"],["design","최종 파일 전달","인쇄용 파일"],
  ["factory","작업지시서·발주","용지·코팅 발주"],["factory","CTP 출력","사내·외주 출력소 (팩스)"],["factory","인쇄","표지·내지 (CIP)"],["factory","인쇄 끝 · 후가공/납품 중","계산서·납품 서류 확인되면 끝"],
  // 명함 등 와우프레스 외주(무옥님 10/5 22:03): PC가 와우 주문 상태를 읽어 자동으로 넘김. 건이 있을 때만 칸이 보임
  ["factory","외주 주문","와우프레스","","공장-와우 주문"],["factory","외주 제작 중","와우프레스","","공장-와우 제작 중"],["factory","외주 출고","와우프레스 배송","","공장-와우 출고"]
].map(([lane,l,t,check,key])=>({lane,l,t,check,key:key||`${{sales:"영업",design:"디자인",factory:"공장",admin:"관리"}[lane]}-${l}`}));
const SK=Object.fromEntries(STEPS.map(s=>[s.key,s]));
const STEP_IDX=Object.fromEntries(STEPS.map((s,i)=>[s.key,i]));
const DONE="끝";
// 간소화(무옥님 10/5 21:15): 실시간 근거가 있는 건 디자인(메일)·인쇄(CIP)까지. 인쇄 뒤(코팅·후가공·제본·납품·관리)는 한 칸으로 묶음
const AFTER="공장-인쇄 끝 · 후가공/납품 중",AFTER_OLD=["공장-코팅·후가공","공장-제본","공장-납품","관리-거래명세표","관리-계산서 확인 메일","관리-세금계산서 발행","관리-입금 확인"];
const ARCH_DAYS=7; // 인쇄 끝 칸에 이 날수 넘게 있으면 첫 화면에서 빠져 📦보관함('서류 확인 전')으로(지우지 않음)
const P=["영업-견적 요청 받음","영업-견적 보냄","영업-제작 요청·접수"],W=STEPS.filter(s=>/^공장-와우/.test(s.key)).map(s=>s.key),F=STEPS.filter(s=>(s.lane==="factory"||s.lane==="admin")&&!W.includes(s.key)).map(s=>s.key);
const WOWCELL={lane:"factory",l:"외주(와우프레스)",t:"주문·제작·출고",key:"외주(와우프레스)"};
const ORDER={wow:[...P,...W,DONE],print:[...P,...F,DONE],design:["디자인-디자인 요청","디자인-편집 작업","디자인-거래처 컨펌","영업-견적 보냄","디자인-최종 파일 전달","영업-제작 요청·접수",...F,DONE]};
const BY="흐름표 화면"; // 이름 고르기 없앰(무옥님 10/5) — 바꾼 사람 칸엔 이 글자
const laneName=k=>LANES.find(L=>L.k===k).name;
const stepName=k=>k===DONE?"끝":SK[k]?`${laneName(SK[k].lane)} · ${SK[k].l}`:k?String(k).replace(/^(영업|디자인|공장|관리)-/,"$1 · "):"단계 확인필요";
// 세부(디티피아 등 한 접수 안의 여러 일): 무슨 일·몇 도·몇 부·몇 연. 없으면 확인필요
// 오래된 순서: 처음 기록된 날짜(지나온 일 첫 줄, 없으면 바꾼 날짜) → 같으면 접수번호(S 9-1이 S 9-2보다 먼저)
const firstAt=r=>(r.log&&r.log[0]&&r.log[0].at)||r.at||"99-99";
const noKey=r=>{const m=String(r.no||"").match(/(\d+)\s*-\s*(\d+)/);return m?(+m[1])*10000+(+m[2]):99999999};

    let shown=phone?Math.min(3,items.length):items.length;

      ${didHtml(r,fStep&&fStep!==WOWCELL.key?fStep:s)}
      ${r.note?`<div class="note">${esc(r.note)}</div>`:""}
      ${(r.log||[]).length>1?`<details class="hist" data-id="${id}"${histOpen===id?" open":""}><summary>지나온 일 ${r.log.length}개 보기</summary><button type="button" class="back sm" data-back="hist">← 뒤로</button><ol>${r.log.map(x=>`<li><b>${esc(stepName(x.step))}</b> <small>${esc(x.at)}</small> · ${esc(x.where||"어디 확인필요")} · ${esc(x.what||"내용 확인필요")}</li>`).join("")}</ol></details>`:""}
      <div class="crow">
        ${r.by||r.at?`<span class="who">마지막 변경 ${esc(r.at||"")} ${esc(r.by||"")}</span>`:"<span></span>"}
        <span class="btns"><button class="b p" type="button" data-detail="${id}">${detailOpen===id?"자세한 내용 접기 ▲":"자세한 내용 ▶"}</button></span>
      </div>
      ${detailOpen===id?detailHtml(r,ord,i,nxt,fin,k):""}
      <details class="more"${editing===id?" open":""} data-id="${id}"><summary>단계 건너뛰기·고치기</summary>
        <button type="button" class="back sm" data-back="edit">← 뒤로</button>
        <div class="edit">
          <label>단계 바로 고르기<select data-f="step" data-id="${id}">${ord.map(x=>`<option value="${x}"${x===s?" selected":""}>${x===DONE?"끝":`${laneName(SK[x].lane)} · ${SK[x].l}`}</option>`).join("")}</select></label>
          <label>종류<select data-f="kind" data-id="${id}"><option${k==="print"?" selected":""}>인쇄만</option><option${k==="design"?" selected":""}>디자인+인쇄</option></select></label>
          <label>영업 담당<select data-f="sales" data-id="${id}">${["강명성","김지열","박인규","담당 확인"].map(x=>`<option${(r.sales||"담당 확인")===x?" selected":""}>${x}</option>`).join("")}</select></label>
          <label>접수번호<input data-f="no" data-id="${id}" value="${esc(r.no)}"></label>
          <label>납품일<input type="date" data-f="due" data-id="${id}" value="${esc(r.due)}"></label>
          <label>메모<input data-f="note" data-id="${id}" value="${esc(r.note)}"></label>
          <label>이 단계 내용 적기 (어디에·무엇을)<input data-f="detail" data-id="${id}" placeholder="예: 해커스 이 과장 메일 · 3000부 견적서"></label>
        </div>
      </details>
      <button type="button" class="back sm" data-close="${id}">▲ 접기</button>
      </div>`:""}
    </article>`}).join("");
  paginate();requestAnimationFrame(()=>requestAnimationFrame(paginate)); // 서랍이 다 그려진 뒤 한 번 더 재서 마지막 줄 잘림 막음
}
// 자세한 내용(무옥님 10/5 "다음 누르면 디테일한 내용"): 사양·부수·담당·거래처·근거, 단계 넘기기는 맨 아래에서 확인 한 번 뒤에만
function detailHtml(r,ord,i,nxt,fin,k){
  const id=r.row,row=(a,b)=>`<div class="dl"><span>${a}</span><b>${b||"확인필요"}</b></div>`;
  const prv=i>0?ord[i-1]:null,nm=x=>x===DONE?"끝":`${laneName(SK[x].lane)} · ${SK[x].l}`;
  const pm=pendingMove&&pendingMove.id===id?pendingMove:null;
  return `<section class="detail">
    <h4>자세한 내용</h4>
    ${row("접수번호",esc(r.no||""))}${row("품목",esc(r.item))}${row("거래처",esc(r.client||""))}${row("영업 담당",esc(r.sales||""))}
    ${row("종류",k==="design"?"디자인+인쇄":k==="wow"?"외주(와우프레스)":"인쇄")}${row("부수",qtyTxt(r)||dtTxt(r))}${row("책 사이즈",esc(sizeOf(r)))}${row("도수",r.colors?esc(r.colors)+"도":esc(colorLog(r)))}${row("납품일",esc(r.due||""))}
    ${r.note?row("메모",esc(r.note)):""}
    ${itemsHtml(r)}
    <h4>지나온 일 · 근거</h4>
    ${(r.log||[]).length?`<ol class="dlog">${r.log.map(x=>`<li><b>${esc(stepName(x.step))}</b> <small>${esc(x.at)}</small><br>어디: ${esc(x.where||"확인필요")}<br>무엇: ${esc(x.what||"확인필요")}<br><small>출처: ${esc(x.by||"확인필요")}</small></li>`).join("")}</ol>`:`<p class="muted">기록 없음(확인필요)</p>`}
    ${fin||/^영업-견적/.test(stepOf(r))?"":delivHtml(r)}
    <h4>단계 바꾸기</h4>
    ${pm?`<div class="confirm"><span>'${esc(nm(pm.to))}' 단계로 ${pm.dir==="next"?"넘길까":"되돌릴까"}?</span><button class="b p" type="button" data-ok="${id}">${pm.dir==="next"?"넘기기":"되돌리기"}</button><button class="b" type="button" data-cancel="${id}">취소</button></div>`
    :`<div class="btns"><button class="b" type="button" data-act="prev" data-id="${id}" ${!prv?"disabled":""}>이전 단계로</button><button class="b p" type="button" data-act="next" data-id="${id}" ${!nxt?"disabled":""}>${nxt?`다음 단계: ${nxt===DONE?"끝":SK[nxt].l}`:"끝"}</button></div>`}
  </section>`;
}
// 납품 완료(무옥님 10/5 '3번': 납품한 사람이 누르고, Claude가 나중에 명세표·용달 청구·택배 송장으로 대조)
function delivHtml(r){
  const id=r.row,d=deliv&&deliv.id===id?deliv:null;
  if(!d)return `<h4>납품</h4><div class="btns"><button class="b p" type="button" data-deliv="${id}">🚚 납품 완료</button></div>`;
  const need=d.m==="택배"?"송장번호":""; // 용달 업체 이름 칸은 뺌(무옥님 10/5 21:40)
  return `<h4>납품 완료</h4><div class="form deliv">
    <div class="btns">${["영업 직접","용달","택배"].map(m=>`<button class="b${d.m===m?" p":""}" type="button" data-dm="${m}" aria-pressed="${d.m===m}">${m}</button>`).join("")}</div>
    ${need?`<label>${need}<input data-dinfo value="${esc(d.info||"")}" placeholder="${need}"></label>`:""}
    ${d.m?`<div class="confirm"><span>'끝'(납품 완료 · ${esc(d.m)})으로 넘길까? 넘기면 진행 중 목록에서 빠지고 📦 보관함으로 가.</span><button class="b p" type="button" data-dok="${id}">납품 완료로 넘기기</button><button class="b" type="button" data-dcancel>취소</button></div>`:`<div class="btns"><span class="muted">어떻게 보냈는지 골라 줘.</span><button class="b" type="button" data-dcancel>취소</button></div>`}
  </div>`;
}
// 서랍 안 목록: 스크롤 대신 한 화면에 들어가는 만큼만 보이고 '다음 ▶'으로 넘김
function paginate(){
  const box=$("listbox"),list=$("list"),cards=[...list.querySelectorAll(".card")];
  if($("drawer").hidden||!cards.length){$("pager").hidden=true;return}
  let start=pageStarts[pageStarts.length-1]||0;if(start>=cards.length){pageStarts=[0];start=0}
  cards.forEach((c,i)=>{c.hidden=i<start});
  const H=box.clientHeight-8;let end=cards.length;
  for(let i=start;i<cards.length;i++){const c=cards[i];
    if(i>start&&c.offsetTop+c.offsetHeight>H&&!(editing!=null&&c.querySelector(`details[data-id="${editing}"][open]`))&&!(histOpen!=null&&c.querySelector(`details.hist[data-id="${histOpen}"][open]`))&&!c.classList.contains("open")){end=i;break}}
  cards.forEach((c,i)=>{if(i>=end)c.hidden=true});
  box.style.overflow=cards.slice(start,end).some(c=>c.offsetTop+c.offsetHeight>H)?"auto":"hidden";
  const multi=start>0||end<cards.length;$("pager").hidden=!multi;
  $("pgTxt").textContent=`${start+1}~${end} / ${cards.length}건`;$("pgPrev").disabled=start===0;$("pgNext").disabled=end>=cards.length;
  $("pgNext").dataset.next=end;
}
function gotoOpen(){for(let k=0;k<20;k++){const c=document.querySelector("#list .card.open");if(!c||!c.hidden)return;if($("pgNext").disabled)return;pageStarts.push(+$("pgNext").dataset.next||0);render()}}
function openDrawer(){if($("drawer").hidden){pageStarts=[0]}$("drawer").hidden=false;$("shade").hidden=false;render()}
function closeDrawer(){openRow=null;$("drawer").hidden=true;$("shade").hidden=true;fStep=null;stepFromSum=false;fLate=false;fStale=false;pageStarts=[0];render()}
function onData(d){
  const sig={};(d.rows||[]).forEach(r=>{const {row,...rest}=r;sig[rowKey(r)]=JSON.stringify(rest)});
  if(!firstLoad){const c=Object.keys(sig).filter(k=>prevSig[k]!==sig[k]);if(c.length){changed=new Set(c);clearTimeout(onData.h);onData.h=setTimeout(()=>{changed.clear();render()},15000)}}
  prevSig=sig;firstLoad=false;data=d;lastOk=Date.now();
  // 사람이 칸을 고치는 중이면 화면을 다시 그리지 않음
  const a=document.activeElement;if(a&&a.matches&&a.matches(".edit input, .form input, [data-dinfo]"))return;
  render();
}
async function load(){
  if(busy||document.hidden)return;busy=true;
  try{onData(await call("getData"))}catch(e){}finally{busy=false;tick()}
}
async function save(row,patch){
  const r=data.rows.find(x=>x.row===row);if(!r)return;
  const me=BY,item=r.item;
  busy=true;
  try{onData(await call("update",row,item,patch,me));toast("저장했어. 다른 화면에도 곧 바뀌어.")}
  catch(e){
    const m=String(e&&e.message||e||"");
    // 그사이 다른 곳(자동 넣기 등)에서 표가 바뀌었으면: 새로 받아서 같은 건을 찾아 한 번만 다시 저장
    if(m.includes("표가 바뀌었어")){try{const d=await call("getData");const n=(d.rows||[]).find(x=>x.item===item);if(n){onData(await call("update",n.row,item,patch,me));toast("저장했어. 다른 화면에도 곧 바뀌어.");return}onData(d)}catch(_){}}
    if(!m.includes("LOGIN"))toast(m&&m.length<80?m:"저장이 안 됐어. 다시 눌러 줘.");
    render(); // 누른 버튼을 다시 살림
  }
  finally{busy=false}
}
function tick(){
  const now=new Date();$("clock").textContent=`${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  if(!lastOk){$("liveTxt").textContent="불러오는 중…";return}
  const ago=Math.round((Date.now()-lastOk)/1000),stale=ago>60;
  $("dot").classList.toggle("stale",stale);
  $("liveTxt").textContent=stale?`연결 끊김 (${ago}초째) · 인터넷 확인`:`실시간 · ${ago}초 전 확인`;
}
$("lanes").addEventListener("click",e=>{const b=e.target.closest("button[data-s]");if(!b)return;const j=e.target.closest("[data-job]");fStep=b.dataset.s;fLate=false;fStale=false;pageStarts=[0];openRow=j?+j.dataset.job:null;openDrawer();if(j)gotoOpen()});
$("kpis").addEventListener("click",e=>{const b=e.target.closest("button[data-k]");if(!b)return;const k=b.dataset.k;fStep=null;fLate=false;fStale=false;pageStarts=[0];
  $("fLane").value="";$("fSales").value="";$("fClient").value="";$("fDone").value=k==="done"?"done":k==="arch"?"arch":"open";
  if(k.startsWith("lane:"))$("fLane").value=k.slice(5);if(k==="late")fLate=true;if(k==="stale")fStale=true;openDrawer()});
$("openList").addEventListener("click",()=>{fStep=null;fLate=false;fStale=false;$("fLane").value="";$("fSales").value="";$("fClient").value="";$("fDone").value="open";openDrawer()});
$("addTop").addEventListener("click",()=>{fStep=null;fLate=false;fStale=false;openDrawer();$("addForm").hidden=false;$("nItem").focus()});
$("dClose").addEventListener("click",closeDrawer);$("shade").addEventListener("click",closeDrawer);
$("dBack").addEventListener("click",()=>{if(pageStarts.length>1){pageStarts.pop();render()}else if(stepFromSum){fStep=null;stepFromSum=false;pageStarts=[0];render()}else closeDrawer()});
$("dSum").addEventListener("click",e=>{const b=e.target.closest("button[data-sum]");if(!b)return;fStep=b.dataset.sum;stepFromSum=true;pageStarts=[0];$("dSum").hidden=true;render()});
document.addEventListener("click",e=>{const b=e.target.closest("button[data-back]");if(!b)return;const d=b.closest("details");if(d)d.open=false});
// Esc = 뒤로: 열린 것 중 가장 안쪽부터 하나씩 닫음 (고치기 칸 → 새 건 입력 → 목록 쪽 → 서랍 → 일량 자세히)
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;
  const ed=document.querySelector("#list details.more[open],#list details.hist[open]");if(ed){ed.open=false;return}
  if(openRow!=null){openRow=null;render();return}
  if(!$("drawer").hidden&&!$("addForm").hidden){$("addForm").hidden=true;paginate();return}
  if(!$("drawer").hidden){$("dBack").click();return}
  if(glOpen){glOpen=false;renderDaily();return}
  if(pbSel){pbSel="";renderDaily();return}
  const dl=document.getElementById("dtList");if(dl&&dl.open){dl.open=false;return}const dm=document.getElementById("dailyMore");if(dm&&dm.open){dm.open=false}});
$("pgNext").addEventListener("click",()=>{pageStarts.push(+$("pgNext").dataset.next||0);render()});
$("pgPrev").addEventListener("click",()=>{if(pageStarts.length>1)pageStarts.pop();render()});
$("daily").addEventListener("click",e=>{if(e.target.closest("[data-gl]")){glOpen=true;renderDaily();return}if(e.target.closest("[data-glback]")){glOpen=false;renderDaily();return}if(e.target.closest(".glo"))return;if(e.target.closest("[data-pbback]")){pbSel="";renderDaily();return}const c=e.target.closest("[data-pb]");if(!c)return;pbSel=pbSel===c.dataset.pb?"":c.dataset.pb;renderDaily()});
$("daily").addEventListener("keydown",e=>{const c=e.target.closest&&e.target.closest("[data-pb],[data-gl]");if(c&&(e.key==="Enter"||e.key===" ")){e.preventDefault();c.click()}});
$("daily").addEventListener("toggle",e=>{if(e.target.id==="dailyMore")dailyOpen=e.target.open;if(e.target.id==="dtList")dtOpen=e.target.open},true);
window.addEventListener("resize",()=>{if(!$("drawer").hidden)render();else fitSteps()});
["fLane","fSales","fClient","fDone"].forEach(id=>$(id).addEventListener("change",()=>{fStep=null;fLate=false;fStale=false;pageStarts=[0];render()}));
$("addBtn").addEventListener("click",()=>{$("addForm").hidden=!$("addForm").hidden;if(!$("addForm").hidden)$("nItem").focus();paginate()});
$("addCancel").addEventListener("click",()=>{$("addForm").hidden=true});
$("addForm").addEventListener("submit",async e=>{
  e.preventDefault();const me=BY;
  const kind=$("nKind").value;
  const job={item:$("nItem").value.trim(),client:$("nClient").value.trim(),qty:$("nQty").value.trim(),no:$("nNo").value.trim(),kind,sales:$("nSales").value,due:$("nDue").value,note:$("nNote").value.trim(),step:kind.includes("디자인")?"디자인-디자인 요청":"영업-견적 요청 받음"};
  if(!job.item)return;busy=true;
  try{onData(await call("addJob",job,me));$("addForm").reset();$("addForm").hidden=true;toast("새 건 등록했어.")}
  catch(err){toast(err&&err.message?err.message:"등록이 안 됐어.")}finally{busy=false}
});
$("list").addEventListener("click",e=>{
  const c=e.target.closest("button[data-close]");if(c){openRow=null;editing=null;histOpen=null;render();return}
  const ln=e.target.closest(".line[data-open]");if(ln&&!e.target.closest("button")){const id=+ln.dataset.open;openRow=openRow===id?null:id;editing=null;histOpen=null;render();return}
  const dt=e.target.closest("button[data-detail]");if(dt){const id=+dt.dataset.detail;detailOpen=detailOpen===id?null:id;pendingMove=null;render();return}
  const dv=e.target.closest("button[data-deliv]");if(dv){deliv={id:+dv.dataset.deliv,m:"",info:""};pendingMove=null;render();return}
  const dm=e.target.closest("button[data-dm]");if(dm&&deliv){deliv.m=dm.dataset.dm;deliv.info="";render();return}
  if(e.target.closest("button[data-dcancel]")){deliv=null;render();return}
  const dk=e.target.closest("button[data-dok]");if(dk&&deliv){const d=deliv,r=data.rows.find(x=>x.row===d.id);if(!r)return;
    const inp=document.querySelector("[data-dinfo]");d.info=inp?inp.value.trim():"";
    if(d.m==="택배"&&!d.info){toast("송장번호를 넣어 줘.");return}
    if(dk.disabled)return;dk.disabled=true;dk.textContent="저장 중…";deliv=null;
    save(r.row,{step:DONE,detail:{where:d.m+(d.info?(d.m==="택배"?" 송장 ":" ")+d.info:""),what:"납품 완료(서류 대조 전)"}});return}
  const cc=e.target.closest("button[data-cancel]");if(cc){pendingMove=null;render();return}
  const ok=e.target.closest("button[data-ok]");if(ok){const pm=pendingMove,r=pm&&data.rows.find(x=>x.row===pm.id);if(!r||stepOf(r)!==pm.from){pendingMove=null;render();return}if(ok.disabled)return;ok.disabled=true;ok.textContent="저장 중…";pendingMove=null;save(r.row,{step:pm.to});return}
  const sh=e.target.closest("button[data-show]");if(sh){const id=+sh.dataset.show;openRow=openRow===id?null:id;detailOpen=null;pendingMove=null;editing=null;histOpen=null;render();return}
  const b=e.target.closest("button[data-act]");if(!b)return;
  const r=data.rows.find(x=>x.row===+b.dataset.id);if(!r)return;
  const ord=ORDER[kindOf(r)],i=ord.indexOf(stepOf(r));
  const j=b.dataset.act==="next"?i+1:i-1;if(i<0||j<0||j>=ord.length)return;
  pendingMove={id:r.row,dir:b.dataset.act,to:ord[j],from:ord[i]};render();
});
$("list").addEventListener("toggle",e=>{const d=e.target;if(d.matches&&d.matches("details.more")){editing=d.open?+d.dataset.id:(editing===+d.dataset.id?null:editing);paginate()}
  if(d.matches&&d.matches("details.hist")){histOpen=d.open?+d.dataset.id:(histOpen===+d.dataset.id?null:histOpen);paginate()}},true);
$("list").addEventListener("change",e=>{
  const t=e.target,f=t.dataset.f;if(!f)return;const row=+t.dataset.id,r=data.rows.find(x=>x.row===row);if(!r)return;
  if(f==="detail"){const v=t.value.trim();if(!v)return;save(row,{detail:{where:r.client||"",what:v}});return}
  const patch={[f]:t.value.trim()};
  if(f==="kind"){const ord=ORDER[t.value.includes("디자인")?"design":"print"];if(!ord.includes(stepOf(r)))patch.step=ord[0]}
  save(row,patch);
});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
if(MOCK)$("mock").hidden=false;
$("gateForm").addEventListener("submit",async e=>{
  e.preventDefault();const b=$("gateBtn");b.disabled=true;$("gateMsg").textContent="확인하는 중…";
  try{const r=await call("login",$("gatePw").value);
    if(r&&r.ok){KEY=r.key;store.set("samboFlowKey",KEY);$("gate").hidden=true;$("gateMsg").textContent="";load()}
    else{$("gateMsg").textContent=(r&&r.msg)||"다시 해 줘.";$("gatePw").value="";$("gatePw").focus()}
  }catch(_){$("gateMsg").textContent="연결이 안 돼. 잠시 뒤 다시 해 줘."}finally{b.disabled=false}
});
render();
if(MOCK&&location.hash==="#gate")showGate();else if(!MOCK&&!KEY)showGate();else load();
setInterval(()=>{if($("gate").hidden)load()},5000);setInterval(tick,1000);
</script>
